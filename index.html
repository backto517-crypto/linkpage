<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>YAQOB AL-AROMI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f5257;--accent:#0ea5a3;--btn:#000000aa;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',sans-serif;background:linear-gradient(180deg,#0f5257 0%,#0f6b6f 100%);color:var(--white);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.container{width:100%;max-width:420px;background:transparent;border-radius:14px;text-align:center}
.header-bg{height:120px;background-image:url('');background-size:cover;background-position:center;border-radius:12px 12px 0 0;position:relative;overflow:hidden}
.avatar{width:110px;height:110px;border-radius:50%;background:#08191a;display:inline-block;margin:-55px auto 8px;position:relative;border:6px solid rgba(255,255,255,0.06);box-shadow:0 6px 18px rgba(0,0,0,0.5)}
.name{font-family:'Playfair Display',serif;font-size:28px;letter-spacing:2px;margin-top:8px}
.tagline{font-style:italic;color:rgba(255,255,255,0.85);padding:8px 20px;font-size:15px}
.icons{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--white)}
.buttons{display:flex;flex-direction:column;gap:14px;padding:12px}
.btn{background:var(--btn);color:var(--white);padding:18px;border-radius:40px;text-decoration:none;display:block;font-weight:500;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,0.35);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.small{font-size:14px;color:rgba(255,255,255,0.85)}
.footer-space{height:36px}
@media(min-width:760px){body{padding:48px} .container{max-width:720px} .name{font-size:40px}}
</style>
</head>
<body>
<div class="container" role="main">
<div class="header-bg" style="background-image:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1400&auto=format&fit=crop&s=placeholder');">
</div>

<div class="avatar" aria-hidden="true" style="background-image:url(' ');background-size:cover;background-position:center;">
<!-- ضع رابط الشعار هنا بوصفه background-image أو استخدم <img> لو رغبت -->
</div>

<h1 class="name">YAQOB AL-AROMI</h1>
<p class="tagline">"Welcome to my Linktree, your one-stop-shop to access all my social media"</p>

<div class="icons" aria-label="social icons">
<a class="icon" href="#" title="Facebook">f</a>
<a class="icon" href="#" title="WhatsApp">w</a>
<a class="icon" href="#" title="Instagram">ig</a>
<a class="icon" href="#" title="Telegram">tg</a>
<a class="icon" href="#" title="X">x</a>
<a class="icon" href="#" title="Email">@</a>
<a class="icon" href="#" title="LinkedIn">in</a>
</div>

<div class="buttons">
<a class="btn" href="https://google.com" target="_blank" rel="noopener">Deepseek</a>
<a class="btn" href="https://example.com/2" target="_blank" rel="noopener">Sina chat</a>
<a class="btn" href="https://example.com/3" target="_blank" rel="noopener">Gimini chat</a>
<a class="btn" href="https://example.com/4" target="_blank" rel="noopener">موقعي الآخر</a>
</div>

<div class="footer-space"></div>
</div>
</body>
</html>
